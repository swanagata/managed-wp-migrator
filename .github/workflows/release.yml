name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches the plugin version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          header="$(sed -n 's/^ \* Version: *//p' managed-wp-migrator.php)"
          constant="$(sed -n "s/^ *const VERSION = '\(.*\)';/\1/p" managed-wp-migrator.php)"
          echo "tag=$tag header=$header constant=$constant"
          test "$tag" = "$header" && test "$tag" = "$constant"

      - name: Build the installable zip
        run: |
          mkdir -p build/managed-wp-migrator
          cp managed-wp-migrator.php build/managed-wp-migrator/
          (cd build && zip -r ../managed-wp-migrator.zip managed-wp-migrator)

      # Managed WP serves the asset named managed-wp-migrator.zip from the latest release.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" managed-wp-migrator.zip --title "$GITHUB_REF_NAME" --generate-notes
